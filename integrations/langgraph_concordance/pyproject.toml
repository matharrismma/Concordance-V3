[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-concordance"
version = "0.1.0"
description = "Concordance verification as a LangGraph node, a verdict router, and a LangChain tool."
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "concordance-client",
]

[tool.setuptools]
packages = ["langgraph_concordance"]
