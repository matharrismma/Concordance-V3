[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoevals-concordance"
version = "0.1.0"
description = "autoevals Scorer backed by Concordance: verdict, trace, link budget, receipt."
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["autoevals>=0.0.100", "concordance-client"]

[project.optional-dependencies]
local = ["concordance"]

[tool.setuptools]
packages = ["autoevals_concordance"]
