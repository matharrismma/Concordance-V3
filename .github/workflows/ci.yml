name: gates
on: [push, pull_request]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[math,scribe,signing,dev]"
      - run: python tools/check.py   # the one gate list (it writes benchmark.json, uploaded below)
      - uses: actions/upload-artifact@v4
        with: {name: benchmark, path: benchmark.json}
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[math,scribe,signing,dev]"
      - run: PYTHONPATH=src python -m pytest -q -m slow
      - run: PYTHONPATH=src python tools/mutate.py --sample 20 --seed 3 || true   # reported, not yet a hard gate
  integrations:
    # the scorer adapters: outside the core closure, installed on their own, run against the in-process engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[math,signing]" -e "integrations[deepeval,autoevals,langgraph,langchain,guardrails,dev]"   # verifiers (PrimeIntellect) pulls a pytest plugin needing langchain; its test skips when absent
      - run: PYTHONPATH=src python -m pytest -q tests/test_integrations.py integrations
